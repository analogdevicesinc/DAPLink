common:
    target:
        - max32690
    core:
        - Cortex-M4F
    macros:
        - INTERFACE_MAX32690
        - DAPLINK_HIC_ID=0x97969908 # DAPLINK_HIC_ID_MAX32625
        - OS_CLOCK=120000000
        - TARGET=MAX32690
        - TARGET_REV=0x4131
        - MAX32690
    includes:
        - source/hic_hal/maxim/max32690
        - source/hic_hal/maxim/max32690/Include
    sources:
        hic_hal:
            - source/hic_hal/maxim/max32690
            - source/hic_hal/maxim/max32690/Source

tool_specific:
    uvision:
        misc:
            ld_flags:
                - --predefine="-I..\..\..\source\hic_hal\maxim\max32690"
            asm_flags:
                - -I../../../source/daplink
        sources:
            hic_hal:
                - source/hic_hal/maxim/max32690/armcc
    armcc:
        sources:
            hic_hal:
                - source/hic_hal/maxim/max32690/armcc
    armclang:
        sources:
            hic_hal:
                - source/hic_hal/maxim/max32690/armcc
    gcc_arm:
        sources:
            hic_hal:
                - source/hic_hal/maxim/max32690/gcc
